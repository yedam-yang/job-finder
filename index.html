<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>잡파인더 | 충남대 학생을 위한 채용 탐색</title><style>:root{--navy:#12324a;--blue:#2176c7;--green:#1b9b78;--paper:#f7fbfb;--ink:#152a3a;--muted:#62717d;--line:#dce8e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button{font:inherit;cursor:pointer}header{background:linear-gradient(115deg,#12324a,#176d79);color:#fff;padding:20px max(24px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800}.brand b{background:#8ce0b9;border-radius:10px;padding:3px 8px;color:#12324a}.tag{font-size:13px;color:#d4f8e8}nav{display:flex;gap:8px}nav button{background:transparent;border:1px solid transparent;color:#dff8ed;padding:9px 12px;border-radius:9px;font-weight:700}nav button.active,nav button:hover{background:#ffffff1e;border-color:#ffffff3d;color:#fff}main{max-width:1120px;margin:auto;padding:34px 24px 70px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:25px}.hero h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-1.5px}.hero p{color:var(--muted);margin:8px 0 0}.score{background:#fff6dc;border:1px solid #f0d98f;padding:12px 15px;border-radius:13px;font-size:14px;white-space:nowrap}.filters{position:sticky;top:0;z-index:2;background:#f7fbfbeb;backdrop-filter:blur(10px);border:1px solid var(--line);padding:14px;border-radius:16px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.filters button{border:1px solid #cddedd;background:#fff;color:#42606a;border-radius:99px;padding:9px 13px;font-weight:700;font-size:14px}.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}.count{font-size:14px;color:var(--muted);margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 8px 24px #17425a0a}.card.top{border:2px solid #77cba8}.company{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px}.company b{display:block}.company small{color:var(--muted)}.save{margin-left:auto;border:0;background:#eff6f5;color:#276753;border-radius:10px;padding:8px 10px;font-weight:800}.save.saved{background:#d5f5e7;color:#08744d}.role{font-size:21px;margin:20px 0 6px;letter-spacing:-.5px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e4f5ff;color:#1b6597;font-size:12px;font-weight:800}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}.details div{background:#f5f9f9;border-radius:10px;padding:9px;font-size:13px}.details span{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}.desc{color:#46606b;font-size:14px;margin:12px 0 5px}.more{border:0;background:none;color:#15705a;font-weight:800;padding:3px 0;font-size:13px}.hidden{display:none}.empty{grid-column:1/-1;text-align:center;padding:54px;background:#fff;border:1px dashed #b9cdcb;border-radius:18px;color:var(--muted)}.savedView{display:none}.savedView.show{display:block}.footer-note{margin-top:26px;color:#70818a;font-size:13px}@media(max-width:700px){header{padding:16px 20px}.tag{display:none}main{padding:25px 16px}.hero{display:block}.score{display:inline-block;margin-top:15px}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><b>J</b>잡파인더 <span class="tag">충남대 컴퓨터인공지능학부 1학년의 첫 커리어 탐색</span></div><nav><button class="active" id="jobsTab">채용 공고</button><button id="savedTab">저장 목록 <span id="savedNum">0</span></button></nav></header><main><section id="jobsView"><div class="hero"><div><h1>오늘의 가능성을 찾아볼까요? ✨</h1><p>인턴·신입 공고를 조건별로 살펴보고, 마음에 드는 기회는 저장해 두세요.</p></div><div class="score">추천 순위: 인지도 · 보상 · 마감일 · 구체성</div></div><div class="filters" aria-label="공고 필터"><button data-filter="all" class="on">전체</button><button data-filter="intern">인턴</button><button data-filter="entry">신입</button><button data-filter="urgent">마감 임박</button><button data-filter="paid">급여·지원금 있음</button><button data-filter="clear">지원 자격 명확</button><button data-filter="short">짧은 인턴</button></div><div class="count" id="count"></div><div class="grid" id="cards"></div></section><section class="savedView" id="savedView"><div class="hero"><div><h1>저장한 공고 💚</h1><p>관심 있는 기회를 한곳에서 다시 확인하세요.</p></div></div><div class="grid" id="savedCards"></div></section><p class="footer-note">공고 정보는 지원 전 회사 공식 채용 페이지에서 한 번 더 확인해 주세요.</p></main><script>const jobs=[{id:1,c:'네이버',f:'NAVER',color:'#19b461',known:'인지도 ★★★★★',role:'AI 서비스 개발 인턴',type:'intern',pay:'월 250만원',due:3,period:8,clear:true,desc:'생성형 AI 기능의 프로토타입을 만들고, 사용자 피드백 기반으로 기능을 개선합니다.',full:'Python 또는 JavaScript로 AI 서비스 기능을 구현합니다. 실험 결과를 정리하고 제품 팀과 함께 사용자 흐름을 개선합니다.'},{id:2,c:'카카오',f:'K',color:'#f6c70b',known:'인지도 ★★★★★',role:'프론트엔드 개발 신입',type:'entry',pay:'연봉 협의',due:10,period:0,clear:true,desc:'웹 서비스 화면을 구현하고 디자인·백엔드 팀과 제품 경험을 완성합니다.',full:'React 기반 UI를 개발하고 성능과 접근성을 개선합니다. 코드 리뷰와 테스트 자동화에 참여합니다.'},{id:3,c:'당근',f:'🥕',color:'#ff6f30',known:'인지도 ★★★★☆',role:'프로덕트 엔지니어 인턴',type:'intern',pay:'월 230만원',due:5,period:6,clear:true,desc:'지역 커뮤니티 기능을 개발하며 실제 사용자 문제를 빠르게 해결합니다.',full:'TypeScript와 React로 기능을 개발합니다. 데이터 분석 결과와 인터뷰를 바탕으로 실험을 설계하고 배포합니다.'},{id:4,c:'토스',f:'T',color:'#3182f6',known:'인지도 ★★★★★',role:'서버 개발 인턴',type:'intern',pay:'월 260만원',due:1,period:4,clear:true,desc:'금융 서비스 API의 안정성과 성능을 높이는 백엔드 개발을 경험합니다.',full:'Kotlin 또는 Java 기반 API를 구현하고, 모니터링 지표를 분석해 장애 대응과 성능 개선 업무를 수행합니다.'},{id:5,c:'모두의연구소',f:'M',color:'#7266d9',known:'인지도 ★★★☆☆',role:'AI 교육 콘텐츠 운영 신입',type:'entry',pay:'지원금 150만원',due:14,period:0,clear:false,desc:'AI 학습 커뮤니티 프로그램 운영과 콘텐츠 제작을 보조합니다.',full:'학습자 문의 대응, 교육 자료 작성, 프로그램 운영 데이터를 정리합니다. AI와 교육에 관심 있는 분을 찾습니다.'},{id:6,c:'라이너',f:'L',color:'#5936d8',known:'인지도 ★★★★☆',role:'AI 리서치 인턴',type:'intern',pay:'월 220만원',due:8,period:12,clear:true,desc:'검색·요약 모델의 품질을 평가하고, 개선용 데이터셋을 만듭니다.',full:'프롬프트와 검색 결과를 평가해 오류 유형을 분류합니다. Python으로 간단한 분석 스크립트를 작성할 수 있으면 좋아요.'}];let filter='all',saved=JSON.parse(localStorage.getItem('jfSaved')||'[]');const card=j=>`<article class="card ${j.due<=3?'top':''}"><div class="company"><div class="logo" style="background:${j.color}">${j.f}</div><div><b>${j.c}</b><small>${j.known}</small></div><button class="save ${saved.includes(j.id)?'saved':''}" onclick="toggleSave(${j.id})">${saved.includes(j.id)?'✓ 저장됨':'♡ 저장'}</button></div><h2 class="role">${j.role}</h2><span class="badge">${j.type==='intern'?'인턴':'신입'}</span><div class="details"><div><span>급여·지원금</span>${j.pay}</div><div><span>마감일</span>${j.due}일 후</div>${j.type==='intern'?`<div><span>근무 기간</span>${j.period}주</div>`:''}<div><span>지원 자격</span>${j.clear?'전공·기술 요건 명확':'관련 관심·경험'}</div></div><p class="desc"><b>업무 핵심</b> · ${j.desc}</p><div class="hidden" id="more-${j.id}"><p class="desc"><b>전체 업무 설명</b> · ${j.full}</p></div><button class="more" onclick="document.getElementById('more-${j.id}').classList.toggle('hidden');this.textContent=this.textContent.includes('전체')?'접기':'전체 내용 보기'">전체 내용 보기</button></article>`;function visible(){let a=[...jobs];if(filter==='intern'||filter==='entry')a=a.filter(x=>x.type===filter);if(filter==='paid')a=a.filter(x=>x.pay);if(filter==='clear')a=a.filter(x=>x.clear);if(filter==='urgent')a.sort((a,b)=>a.due-b.due);else if(filter==='short')a.sort((a,b)=>(a.type==='intern'?a.period:999)-(b.type==='intern'?b.period:999));else a.sort((a,b)=>(b.known.length+b.clear*2+(!!b.pay)*2)-(a.known.length+a.clear*2+(!!a.pay)*2)||a.due-b.due);return a}function render(){const a=visible();cards.innerHTML=a.length?a.map(card).join(''):'<div class="empty">조건에 맞는 공고가 없어요. 다른 필터를 선택해 보세요.</div>';count.textContent=`${a.length}개의 공고를 보고 있어요`;savedCards.innerHTML=saved.length?jobs.filter(j=>saved.includes(j.id)).map(card).join(''):'<div class="empty">아직 저장한 공고가 없어요.<br>마음에 드는 공고의 ♡ 저장 버튼을 눌러 보세요.</div>';savedNum.textContent=saved.length}function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('jfSaved',JSON.stringify(saved));render()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});jobsTab.onclick=()=>{jobsView.style.display='block';savedView.classList.remove('show');jobsTab.classList.add('active');savedTab.classList.remove('active')};savedTab.onclick=()=>{jobsView.style.display='none';savedView.classList.add('show');savedTab.classList.add('active');jobsTab.classList.remove('active')};render();</script></body></html>
